groups:
- id: entity.signoz.organization
  type: entity
  name: signoz.organization
  stability: development
  brief: >
    A SigNoz organization, the tenant boundary on the backend plane.
  note: |
    Identified by its id alone. Backend-plane signals such as billing
    readings and audit events associate with this entity; ingested telemetry
    associates with `signoz.workspace` instead (see the workspace area).
  attributes:
  - ref: signoz.organization.id
    role: identifying
    requirement_level: required

- id: entity.signoz.principal
  type: entity
  name: signoz.principal
  stability: development
  brief: >
    A principal of the SigNoz platform: an authenticated user or service account.
  note: |
    Identified by its id alone, which is unique across principal types; the
    type is therefore descriptive rather than part of the identity. The
    principal is the actor recorded in signals such as audit events.
  attributes:
  - ref: signoz.principal.id
    role: identifying
    requirement_level: required
  - ref: signoz.principal.type
    role: descriptive
    requirement_level: required
  - ref: signoz.principal.email
    role: descriptive
