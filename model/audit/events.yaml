groups:
- id: event.signoz.audit.event
  type: event
  name: signoz.audit.event
  stability: development
  brief: >
    Records one operation a principal performed on a SigNoz resource.
  note: |
    Recorded once per operation, after the operation has completed and its
    outcome is known. The timestamp is the time of the operation.

    One event name covers every audited operation, because every occurrence
    carries the same attribute set. The operation and its object are
    attributes, never part of the name: query `signoz.audit.verb` and
    `signoz.resource.kind` instead.

    Instrumentations SHOULD set severity `INFO` (9) when
    `signoz.audit.outcome` is `success` and `ERROR` (17) when it is
    `failure`.

    Attribute placement: `signoz.resource.*` are set on the OpenTelemetry
    Resource, so that records about one resource share a resource
    fingerprint and can be filtered without touching the record attributes.
    Queries therefore address them with the resource context, as in
    `resource.signoz.resource.kind`. Every other attribute is set on the
    record. The Resource also carries the producer's `service.name` and
    `service.version`.

    An operation that relates two resources, such as `attach` and `detach`,
    is recorded once from each side. The two records describe the same
    operation from opposite directions: what `signoz.resource.*` names in
    one, `signoz.resource.target.*` names in the other.

    The body, when set, is a human-readable sentence describing the
    operation. It carries no attribute that is not also recorded as an
    attribute, and it MUST NOT contain the principal's email address.
  attributes:
  - ref: signoz.audit.verb
    requirement_level: required
  - ref: signoz.audit.action_category
    requirement_level: required
  - ref: signoz.audit.outcome
    requirement_level: required
  - ref: signoz.organization.id
    requirement_level: required
    brief: >
      Organization that owns the resource the operation was performed on.
  - ref: signoz.resource.kind
    requirement_level: required
  - ref: signoz.resource.id
    requirement_level: required
    note: |
      Set to `*` when the operation applies to the collection of all
      resources of the kind rather than to a single resource, as a `list`
      does.
  - ref: signoz.resource.object
    requirement_level: recommended
  - ref: signoz.resource.target.kind
    requirement_level:
      conditionally_required: If the operation relates two resources.
  - ref: signoz.resource.target.id
    requirement_level:
      conditionally_required: If the operation relates two resources.
  - ref: signoz.resource.target.object
    requirement_level:
      recommended: If the operation relates two resources.
  - ref: signoz.principal.id
    requirement_level:
      conditionally_required: If the request was authenticated.
    note: |
      Identifies the user or the service account that performed the
      operation. An unauthenticated request carries no principal at all.
  - ref: signoz.principal.type
    requirement_level:
      conditionally_required: If the request was authenticated.
  - ref: signoz.principal.email
    requirement_level: recommended
    note: |
      Set for user principals; service accounts have no email address.

      > [!WARNING]
      > This attribute contains personally identifiable information (PII).
  - ref: signoz.workspace.key.id
    requirement_level:
      conditionally_required: If `signoz.resource.kind` is `ingestion-key`.
    note: |
      The audited resource is the ingestion key itself, so the value equals
      `signoz.resource.id`. Recording it under this name too lets a role
      that is scoped to one ingestion key read the audit records of that
      key, the same way it reads the telemetry ingested under it.

      SHOULD also be set when `signoz.resource.kind` is `ingestion-limit`,
      where the key is the one the limit belongs to.
  - ref: error.type
    requirement_level:
      conditionally_required: If `signoz.audit.outcome` is `failure`.
    note: |
      The class of the failure. Values are the error types the platform
      raises: `invalid-input`, `not-found`, `already-exists`,
      `unauthenticated`, `forbidden`, `unsupported`, `canceled`, `timeout`,
      `license-unavailable`, `too-many-requests` and `internal`.

      `signoz.audit.error.code` names the individual failure within the
      class. Error messages are deliberately not recorded: they may carry
      user data, and the trace id correlates the record with the logs that
      do have the detail.
  - ref: signoz.audit.error.code
    requirement_level:
      conditionally_required: If the operation failed with an error that carries a code.
  - ref: http.request.method
    requirement_level:
      conditionally_required: If the operation was served over HTTP.
  - ref: http.route
    requirement_level:
      conditionally_required: If the operation was served over HTTP and a route matched.
  - ref: http.response.status_code
    requirement_level:
      conditionally_required: If the operation was served over HTTP.
  - ref: url.scheme
    requirement_level: recommended
  - ref: url.path
    requirement_level: opt_in
    note: |
      > [!WARNING]
      > Path segments carry resource identifiers, and identifiers of
      > resources the principal was not allowed to reach are recorded too.
      > `http.route` describes the endpoint without them.
  - ref: client.address
    requirement_level: recommended
    note: |
      The address the request came from, without the port. Instrumentations
      that read a `host:port` pair SHOULD split it and record the port as
      `client.port`.
  - ref: client.port
    requirement_level: recommended
  - ref: user_agent.original
    requirement_level: recommended
  - ref: network.protocol.name
    requirement_level: recommended
  - ref: network.protocol.version
    requirement_level: recommended
  entity_associations:
  - signoz.resource
