- id: event.signoz.audit.attach
  type: event
  name: signoz.audit.attach
  stability: development
  extends: attributes.signoz.audit.common
  brief: >
    Records the attachment of one SigNoz resource to another.
  note: |
    Recorded after the operation has completed and its outcome is known.
    The timestamp is the time of the operation.

    An attach operation relates two resources, as in `attach dashboard D to
    alert rule R`, and is recorded twice, once from each side of the
    relation. In one record `signoz.resource.*` describes D and
    `signoz.resource.target.*` describes R; in the other record the two
    attribute sets are swapped. Both records describe the same operation
    from opposite directions and carry the same verb and outcome.

    Instrumentations SHOULD set severity `INFO` (9) when
    `signoz.audit.outcome` is `success` and `ERROR` (17) when it is
    `failure`.

    Attributes and their placement are inherited from
    `attributes.signoz.audit.common`.
  attributes:
  - ref: signoz.resource.target.kind
    requirement_level: required
  - ref: signoz.resource.target.id
    requirement_level: required
  - ref: signoz.resource.target.object
    requirement_level: recommended
  entity_associations:
  - signoz.resource

- id: event.signoz.audit.detach
  type: event
  name: signoz.audit.detach
  stability: development
  extends: attributes.signoz.audit.common
  brief: >
    Records the detachment of one SigNoz resource from another.
  note: |
    Recorded after the operation has completed and its outcome is known.
    The timestamp is the time of the operation.

    A detach operation relates two resources, as in `detach dashboard D
    from alert rule R`, and is recorded twice, once from each side of the
    relation. In one record `signoz.resource.*` describes D and
    `signoz.resource.target.*` describes R; in the other record the two
    attribute sets are swapped. Both records describe the same operation
    from opposite directions and carry the same verb and outcome.

    Instrumentations SHOULD set severity `INFO` (9) when
    `signoz.audit.outcome` is `success` and `ERROR` (17) when it is
    `failure`.

    Attributes and their placement are inherited from
    `attributes.signoz.audit.common`.
  attributes:
  - ref: signoz.resource.target.kind
    requirement_level: required
  - ref: signoz.resource.target.id
    requirement_level: required
  - ref: signoz.resource.target.object
    requirement_level: recommended
  entity_associations:
  - signoz.resource
