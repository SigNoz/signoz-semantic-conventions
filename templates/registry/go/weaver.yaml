# Renders the Go module in semconv/go/ from the resolved registry (weaver --v2
# schema). One file per area: the directory under model/ each definition lives
# in. Only definitions of this registry are rendered; upstream ones come from
# go.opentelemetry.io/otel/semconv.
params:
  areas_filter: &areas >
    .registry as $r
    | [
        ($r.attributes[]
          | select((.annotations.code_generation.exclude // false) | not)
          | {kind: "attributes", v: .}),
        ($r.metrics[] | {kind: "metrics", v: .}),
        ($r.events[] | {kind: "events", v: .}),
        ($r.entities[] | {kind: "entities", v: .})
      ]
    | map(. + {area: (.v.provenance.path | split("/") | if .[-2] == "deprecated" then .[-3] else .[-2] end)})
    | group_by(.area)
    | map({
        area: .[0].area,
        attributes: (map(select(.kind == "attributes") | .v) | sort_by(.key)),
        metrics: (map(select(.kind == "metrics") | .v) | sort_by(.name)),
        events: (map(select(.kind == "events") | .v) | sort_by(.name)),
        entities: (map(select(.kind == "entities") | .v) | sort_by(.type))
      })
templates:
- pattern: go.mod.j2
  filter: .
  application_mode: single
  file_name: go.mod
- pattern: doc.go.j2
  filter: *areas
  application_mode: single
  file_name: doc.go
- pattern: area.go.j2
  filter: *areas
  application_mode: each
  file_name: "{{ ctx.area }}.go"
comment_formats:
  go:
    format: markdown
    prefix: "// "
    indent_first_level_list_items: true
    shortcut_reference_link: true
    trim: true
    word_wrap:
      line_length: 79
  go_1tab:
    format: markdown
    prefix: "\t// "
    indent_first_level_list_items: true
    shortcut_reference_link: true
    trim: true
    word_wrap:
      line_length: 79
default_comment_format: go
# Words written in capitals in Go names, applied to each segment of a key.
acronyms:
- AI
- API
- CPU
- DB
- HTTP
- ID
- IO
- JSON
- OK
- OS
- SDK
- SigNoz
- URL
- UUID
whitespace_control:
  trim_blocks: true
  lstrip_blocks: true
  keep_trailing_newline: true
