name: releaser

on:
  release:
    types:
    - published
  workflow_dispatch:
    inputs:
      tag:
        description: "The published release to attach the registry to (e.g. v0.0.1-rc.1)"
        type: string
        required: true

permissions:
  contents: write

env:
  WEAVER_VERSION: 0.26.1
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - name: self-checkout
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.release.tag_name || inputs.tag }}
    - name: release-verify
      run: hack/release.sh verify "${TAG}"
    - name: go-module-tag
      run: |
        # A Go module in a subdirectory is versioned by tags prefixed with its path.
        gotag="semconv/go/${TAG}"
        if [ ! -f semconv/go/go.mod ]; then
          echo "${TAG} has no semconv/go/go.mod; not tagging ${gotag}."
          exit 0
        fi
        if git ls-remote --exit-code --tags origin "refs/tags/${gotag}" >/dev/null; then
          echo "${gotag} already exists."
          exit 0
        fi
        git tag "${gotag}" HEAD
        git push origin "refs/tags/${gotag}"
    - name: weaver-install
      run: |
        cd "${RUNNER_TEMP}"
        archive="weaver-x86_64-unknown-linux-gnu.tar.xz"
        base="https://github.com/open-telemetry/weaver/releases/download/v${WEAVER_VERSION}"
        curl -fsSLO "${base}/${archive}"
        curl -fsSLO "${base}/${archive}.sha256"
        sha256sum -c "${archive}.sha256"
        tar -xJf "${archive}"
        sudo install "weaver-x86_64-unknown-linux-gnu/weaver" /usr/local/bin/weaver
        weaver --version
    - name: release-package
      run: hack/release.sh package "${TAG}" dist
    - name: github-release-upload
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release upload "${TAG}" dist/manifest.yaml dist/resolved.yaml --clobber
