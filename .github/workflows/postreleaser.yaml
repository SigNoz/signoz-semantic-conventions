name: postreleaser

on:
  release:
    types:
    - published

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
    - name: github-token-gen
      id: token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        app-id: ${{ secrets.PRIMUS_APP_ID }}
        private-key: ${{ secrets.PRIMUS_PRIVATE_KEY }}
    - name: self-checkout
      uses: actions/checkout@v7
      with:
        ref: main
        token: ${{ steps.token.outputs.token }}
    - name: version-next
      id: next
      env:
        TAG: ${{ github.event.release.tag_name }}
      run: |
        semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$'
        version="${TAG#v}"
        if [[ "${TAG}" != v* || ! "${version}" =~ ${semver} ]]; then
          echo "::error::Release tag '${TAG}' is not v followed by a SemVer version."
          exit 1
        fi
        base="${version%%-*}"
        current="$(sed -nE 's#^schema_url: https://signoz.io/schemas/otel/(.*)#\1#p' model/manifest.yaml)"
        if [[ "${current%%-*}" != "${base}" ]]; then
          # main already prepares another version (e.g. an older release was published); leave it.
          echo "main prepares ${current}, not ${base}; nothing to bump."
          echo "version=" >>"${GITHUB_OUTPUT}"
          exit 0
        fi
        if [[ "${version}" == *-* ]]; then
          # After a pre-release, main prepares the same version: 0.0.1-rc.1 -> 0.0.1-unreleased.
          next="${base}-unreleased"
        else
          # After a release, main prepares the next minor: 0.1.0 -> 0.2.0-unreleased.
          IFS=. read -r major minor _ <<<"${base}"
          next="${major}.$((minor + 1)).0-unreleased"
        fi
        echo "version=${next}" >>"${GITHUB_OUTPUT}"
    - name: git-configure
      if: steps.next.outputs.version != ''
      run: |
        git config --global user.name "primus-bot[bot]"
        git config --global user.email "171087277+primus-bot[bot]@users.noreply.github.com"
    - name: postrelease-pr
      if: steps.next.outputs.version != ''
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        TAG: ${{ github.event.release.tag_name }}
        NEXT: ${{ steps.next.outputs.version }}
      run: |
        sed -i -E "s#^(schema_url: https://signoz.io/schemas/otel/).*#\1${NEXT}#" model/manifest.yaml
        if git diff --quiet; then
          echo "schema_url is already ${NEXT}."
          exit 0
        fi
        branch="chore/post-release-${TAG}"
        git switch -c "${branch}"
        git commit -am "chore(release): start ${NEXT}"
        git push origin "${branch}"
        gh pr create --base main --head "${branch}" --title "chore(release): start ${NEXT}" \
          --body "$(printf '%s\n\n%s\n' '#### Chores' "- after \`${TAG}\`, set \`schema_url\` in \`model/manifest.yaml\` to \`${NEXT}\`")"
